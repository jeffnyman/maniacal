# Publishes the NuGet packages to nuget.org with Trusted Publishing: no API key is stored anywhere.
# Push a tag such as v0.1.0-alpha (the tag without its "v" becomes the package version), or run the
# workflow by hand from the Actions tab with a version.
#
# One-time setup:
#   - nuget.org: your username > Trusted Publishing > add a policy for this repository's owner, the
#     repository "maniacal" and the workflow file "publish.yml"
#   - GitHub: Settings > Secrets and variables > Actions > New repository secret NUGET_USER, your
#     nuget.org username (not your email)
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 0.1.0-alpha.2"
        required: true

permissions:
  contents: write   # a tag push also creates the GitHub release
  id-token: write   # Trusted Publishing exchanges the workflow's OIDC token for a short-lived key

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "not a package version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $version"

      # the tests that need the Maniac Mansion game data pass without checking when it is not there
      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack -c Release -o artifacts/packages -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # one file at a time by full path: on Windows, dotnet nuget push only expands a wildcard written
      # with backslashes. The .snupkg symbol package next to each .nupkg goes up with it.
      - name: Push
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem artifacts/packages -Filter *.nupkg
          if ($packages.Count -eq 0) { throw "no packages in artifacts/packages" }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "pushing $($package.Name) failed" }
          }

      # only for a tag push: a version run by hand has no tag to hang a release on. A version with a
      # suffix (1.1.0-alpha) is marked a prerelease. The packages go up with it, for reference.
      - name: GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = @"
          Published to nuget.org:

          - the player: ``dotnet tool install -g Maniacal`` (or ``dotnet tool update -g Maniacal``), [Maniacal $version](https://www.nuget.org/packages/Maniacal/$version)
          - the library: [Maniacal.Scumm $version](https://www.nuget.org/packages/Maniacal.Scumm/$version)
          "@
          $prerelease = if ($version -match '-') { @('--prerelease') } else { @() }
          $packages = (Get-ChildItem artifacts/packages -Filter *.nupkg).FullName
          gh release create "${{ github.ref_name }}" @packages --verify-tag --title $version --notes $notes --generate-notes @prerelease
          if ($LASTEXITCODE -ne 0) { throw "creating the release failed" }
